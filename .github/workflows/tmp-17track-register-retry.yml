name: Temporary 17TRACK Register Retry

on:
  workflow_dispatch:
    inputs:
      app_uuid:
        description: Coolify application UUID
        required: true
        default: zs80848k80oskk0ow0kc0cos
      register_limit:
        description: Max due shipments to register with 17TRACK
        required: true
        default: "20"

concurrency:
  group: tmp-17track-register-retry
  cancel-in-progress: false

jobs:
  retry:
    name: Call register endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Retry 17TRACK registrations
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          APP_UUID: ${{ inputs.app_uuid }}
          REGISTER_LIMIT: ${{ inputs.register_limit }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          required = ["COOLIFY_API_TOKEN", "COOLIFY_DEPLOY_WEBHOOK", "APP_UUID"]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit(f"Missing required secrets/env: {', '.join(missing)}")

          app_uuid = os.environ["APP_UUID"]
          register_limit = int(os.environ.get("REGISTER_LIMIT") or "20")
          register_limit = max(1, min(register_limit, 50))
          deploy_webhook = os.environ["COOLIFY_DEPLOY_WEBHOOK"]
          parsed = urllib.parse.urlparse(deploy_webhook)
          coolify_base = f"{parsed.scheme}://{parsed.netloc}"
          api_token = os.environ["COOLIFY_API_TOKEN"]

          def request(method, url, body=None, headers=None, timeout=60):
              request_headers = dict(headers or {})
              data = None
              if body is not None:
                  data = json.dumps(body).encode("utf-8")
                  request_headers.setdefault("Content-Type", "application/json")
              req = urllib.request.Request(url, data=data, method=method, headers=request_headers)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as response:
                      raw = response.read().decode("utf-8")
                      return response.status, raw
              except urllib.error.HTTPError as error:
                  raw = error.read().decode("utf-8", errors="replace")
                  return error.code, raw

          def parse_json(raw):
              try:
                  return json.loads(raw) if raw else None
              except json.JSONDecodeError:
                  return None

          def coolify(method, path, body=None):
              return request(
                  method,
                  f"{coolify_base}/api/v1{path}",
                  body,
                  {"Authorization": f"Bearer {api_token}"},
              )

          status, raw = coolify("GET", f"/applications/{app_uuid}/envs")
          if status != 200:
              raise SystemExit(f"Could not list Coolify envs: HTTP {status}")
          envs = parse_json(raw) or []
          by_key = {str(item.get("key") or ""): item for item in envs if item.get("key")}
          relevant = [
              "OPS_INTERNAL_API_KEY",
              "QUOTE_INTERNAL_API_TOKEN",
              "INTERNAL_API_KEY",
              "SEVENTEEN_TRACK_API_TOKEN",
              "SEVENTEEN_TRACK_WEBHOOK_TOKEN",
          ]
          print("Existing relevant Coolify env keys:", ", ".join([key for key in relevant if key in by_key]) or "(none)")

          def env_value(*keys):
              for key in keys:
                  item = by_key.get(key) or {}
                  value = str(item.get("real_value") or item.get("value") or "").strip()
                  if value and value != "********":
                      return key, value
              return None, ""

          internal_key_name, internal_key = env_value("OPS_INTERNAL_API_KEY", "QUOTE_INTERNAL_API_TOKEN", "INTERNAL_API_KEY")
          if not internal_key or len(internal_key) < 24:
              raise SystemExit("No readable internal API key found in Coolify envs.")
          print(f"Register auth will use Coolify env key: {internal_key_name}")

          register_url = "https://ops.neontrip.de/api/internal/inbound-shipping/17track-register"
          headers = {
              "Authorization": f"Bearer {internal_key}",
              "Content-Type": "application/json",
              "Accept": "application/json",
          }
          body = {"limit": register_limit}
          status, raw = request("POST", register_url, body, headers, timeout=120)
          payload = parse_json(raw) or {"raw": raw[:500]}
          if status != 200 or not isinstance(payload, dict) or payload.get("ok") is not True:
              raise SystemExit(f"17TRACK register call failed: HTTP {status}; payload={json.dumps(payload, ensure_ascii=True)[:500]}")

          results = payload.get("results") or []
          result_statuses = {}
          for item in results:
              if isinstance(item, dict):
                  item_status = str(item.get("status") or item.get("result") or "unknown")
                  result_statuses[item_status] = result_statuses.get(item_status, 0) + 1
          print("17TRACK register call succeeded.")
          print(json.dumps({
              "claimed": payload.get("claimed"),
              "result_count": len(results),
              "result_statuses": result_statuses,
          }, ensure_ascii=True))
          PY
