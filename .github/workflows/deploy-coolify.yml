name: Deploy Ops App to Coolify

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: coolify-ops-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Test, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:quotes

      - name: Test deployment gate
        run: npm run test:ops-deploy

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  deploy:
    name: Deploy and verify exact commit
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    steps:
      - name: Checkout deployment gate
        uses: actions/checkout@v4

      - name: Setup Node.js for deployment gate
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check deploy webhook secret
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$COOLIFY_DEPLOY_WEBHOOK" ]; then
            echo "COOLIFY_DEPLOY_WEBHOOK is not configured as a GitHub Actions secret."
            echo "Set it to the app-specific Coolify deploy webhook for neontrip-ops-calls."
            exit 1
          fi
          if [ -z "$COOLIFY_API_TOKEN" ]; then
            echo "COOLIFY_API_TOKEN is not configured as a GitHub Actions secret."
            echo "Set it to a Coolify API token allowed to deploy neontrip-ops-calls."
            exit 1
          fi

      - name: Configure health check, deploy, and verify exact commit
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_EXPECT_RESOURCE_UUID: zs80848k80oskk0ow0kc0cos
          COOLIFY_EXPECT_COMMIT: ${{ github.sha }}
          COOLIFY_DEPLOY_TIMEOUT_MS: "900000"
          COOLIFY_DEPLOY_POLL_MS: "5000"
        run: node scripts/deploy_coolify_ops.mjs

      - name: Protected smoke check
        env:
          OPS_SMOKE_BASE_URL: https://ops.neontrip.de
          OPS_SMOKE_EXPECT_PROTECTED: "true"
        run: node scripts/smoke_customer_records_ops.mjs "$OPS_SMOKE_BASE_URL"
