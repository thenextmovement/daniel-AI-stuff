name: Deploy Ops App to Coolify

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: coolify-ops-deploy
  cancel-in-progress: true

jobs:
  validate:
    name: Test, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:quotes

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  deploy:
    name: Trigger Coolify deployment
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Check deploy webhook secret
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$COOLIFY_DEPLOY_WEBHOOK" ]; then
            echo "COOLIFY_DEPLOY_WEBHOOK is not configured as a GitHub Actions secret."
            echo "Set it to the app-specific Coolify deploy webhook for neontrip-ops-calls."
            exit 1
          fi
          if [ -z "$COOLIFY_API_TOKEN" ]; then
            echo "COOLIFY_API_TOKEN is not configured as a GitHub Actions secret."
            echo "Set it to a Coolify API token allowed to deploy neontrip-ops-calls."
            exit 1
          fi

      - name: Trigger Coolify
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          curl --fail --show-error --silent \
            --header "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "$COOLIFY_DEPLOY_WEBHOOK"
          echo "Coolify deployment webhook accepted the request."

      - name: Checkout smoke script
        uses: actions/checkout@v4

      - name: Setup Node.js for smoke
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Protected smoke check
        env:
          OPS_SMOKE_BASE_URL: ${{ secrets.OPS_SMOKE_BASE_URL }}
          OPS_SMOKE_EXPECT_PROTECTED: "true"
        run: |
          if [ -z "$OPS_SMOKE_BASE_URL" ]; then
            echo "OPS_SMOKE_BASE_URL is not configured; skipping protected smoke check."
            exit 0
          fi
          sleep 30
          node scripts/smoke_customer_records_ops.mjs "$OPS_SMOKE_BASE_URL"
