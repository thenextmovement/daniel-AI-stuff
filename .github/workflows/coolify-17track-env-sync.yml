name: Temporary Coolify 17TRACK Env Sync

on:
  workflow_dispatch:
    inputs:
      app_uuid:
        description: Coolify application UUID
        required: true
        default: zs80848k80oskk0ow0kc0cos
      register_limit:
        description: Max due shipments to register with 17TRACK
        required: true
        default: "20"

concurrency:
  group: coolify-17track-env-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync env and register inbound shipments
    runs-on: ubuntu-latest
    steps:
      - name: Upsert Coolify env, redeploy, and call register route
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          SEVENTEEN_TRACK_API_TOKEN: ${{ secrets.SEVENTEEN_TRACK_API_TOKEN }}
          SEVENTEEN_TRACK_WEBHOOK_TOKEN: ${{ secrets.SEVENTEEN_TRACK_WEBHOOK_TOKEN }}
          OPS_INTERNAL_API_KEY_FALLBACK: ${{ secrets.OPS_INTERNAL_API_KEY_17TRACK_SYNC }}
          APP_UUID: ${{ inputs.app_uuid }}
          REGISTER_LIMIT: ${{ inputs.register_limit }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          required = [
              "COOLIFY_API_TOKEN",
              "COOLIFY_DEPLOY_WEBHOOK",
              "SEVENTEEN_TRACK_API_TOKEN",
              "SEVENTEEN_TRACK_WEBHOOK_TOKEN",
              "APP_UUID",
          ]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit(f"Missing required secrets/env: {', '.join(missing)}")

          app_uuid = os.environ["APP_UUID"]
          register_limit = int(os.environ.get("REGISTER_LIMIT") or "20")
          register_limit = max(1, min(register_limit, 50))
          deploy_webhook = os.environ["COOLIFY_DEPLOY_WEBHOOK"]
          parsed = urllib.parse.urlparse(deploy_webhook)
          coolify_base = f"{parsed.scheme}://{parsed.netloc}"
          api_token = os.environ["COOLIFY_API_TOKEN"]

          def request(method, url, body=None, headers=None, timeout=60):
              request_headers = dict(headers or {})
              data = None
              if body is not None:
                  data = json.dumps(body).encode("utf-8")
                  request_headers.setdefault("Content-Type", "application/json")
              req = urllib.request.Request(url, data=data, method=method, headers=request_headers)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as response:
                      raw = response.read().decode("utf-8")
                      return response.status, raw
              except urllib.error.HTTPError as error:
                  raw = error.read().decode("utf-8", errors="replace")
                  return error.code, raw

          def coolify(method, path, body=None):
              return request(
                  method,
                  f"{coolify_base}/api/v1{path}",
                  body,
                  {"Authorization": f"Bearer {api_token}"},
              )

          def parse_json(raw):
              try:
                  return json.loads(raw) if raw else None
              except json.JSONDecodeError:
                  return None

          status, raw = coolify("GET", f"/applications/{app_uuid}/envs")
          if status != 200:
              raise SystemExit(f"Could not list Coolify envs: HTTP {status}")
          envs = parse_json(raw) or []
          by_key = {str(item.get("key") or ""): item for item in envs if item.get("key")}
          target_keys = {
              "SEVENTEEN_TRACK_API_TOKEN",
              "SEVENTEEN_TRACK_WEBHOOK_TOKEN",
              "OPS_INTERNAL_API_KEY",
              "QUOTE_INTERNAL_API_TOKEN",
              "INTERNAL_API_KEY",
          }
          existing_targets = sorted(key for key in target_keys if key in by_key)
          print("Existing relevant Coolify env keys:", ", ".join(existing_targets) or "(none)")

          def upsert_env(key, value):
              body = {
                  "key": key,
                  "value": value,
                  "is_preview": False,
                  "is_literal": True,
                  "is_multiline": False,
                  "is_shown_once": True,
              }
              method = "PATCH" if key in by_key else "POST"
              status, raw = coolify(method, f"/applications/{app_uuid}/envs", body)
              if status not in (200, 201):
                  raise SystemExit(f"Coolify env {method} failed for {key}: HTTP {status}")
              print(f"Coolify env {'updated' if method == 'PATCH' else 'created'}: {key}")

          upsert_env("SEVENTEEN_TRACK_API_TOKEN", os.environ["SEVENTEEN_TRACK_API_TOKEN"])
          upsert_env("SEVENTEEN_TRACK_WEBHOOK_TOKEN", os.environ["SEVENTEEN_TRACK_WEBHOOK_TOKEN"])

          internal_key = None
          for key in ("OPS_INTERNAL_API_KEY", "QUOTE_INTERNAL_API_TOKEN", "INTERNAL_API_KEY"):
              value = str((by_key.get(key) or {}).get("real_value") or (by_key.get(key) or {}).get("value") or "").strip()
              if value and value != "********" and len(value) >= 24:
                  internal_key = value
                  print(f"Register auth will use existing Coolify env key: {key}")
                  break

          if not internal_key:
              fallback = os.environ.get("OPS_INTERNAL_API_KEY_FALLBACK", "").strip()
              if fallback and "OPS_INTERNAL_API_KEY" not in by_key:
                  upsert_env("OPS_INTERNAL_API_KEY", fallback)
                  internal_key = fallback
                  print("Register auth will use newly created Coolify env key: OPS_INTERNAL_API_KEY")
              else:
                  raise SystemExit("No readable internal API key found; refusing to overwrite existing auth key.")

          status, raw = request("GET", deploy_webhook, headers={"Authorization": f"Bearer {api_token}"}, timeout=60)
          if status != 200:
              raise SystemExit(f"Coolify deploy webhook failed: HTTP {status}")
          deploy_payload = parse_json(raw) or {}
          deployment_uuid = None
          deployments = deploy_payload.get("deployments") if isinstance(deploy_payload, dict) else None
          if isinstance(deployments, list) and deployments:
              deployment_uuid = deployments[0].get("deployment_uuid")
          print("Coolify deployment queued:", deployment_uuid or "(uuid unavailable)")

          register_url = "https://ops.neontrip.de/api/internal/inbound-shipping/17track-register"
          body = {"limit": register_limit}
          headers = {
              "Authorization": f"Bearer {internal_key}",
              "Content-Type": "application/json",
              "Accept": "application/json",
          }
          last_status = None
          last_payload = None
          time.sleep(90)
          for attempt in range(1, 17):
              status, raw = request("POST", register_url, body, headers, timeout=60)
              last_status = status
              last_payload = parse_json(raw) or {"raw": raw[:300]}
              if status == 200 and isinstance(last_payload, dict) and last_payload.get("ok") is True:
                  print("17TRACK register call succeeded.")
                  print(json.dumps({
                      "claimed": last_payload.get("claimed"),
                      "result_count": len(last_payload.get("results") or []),
                  }, ensure_ascii=True))
                  break
              print(f"Register attempt {attempt} not ready/successful: HTTP {status}")
              time.sleep(15)
          else:
              raise SystemExit(f"17TRACK register call failed after retries: HTTP {last_status}; payload={json.dumps(last_payload, ensure_ascii=True)[:500]}")
          PY
