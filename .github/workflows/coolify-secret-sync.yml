name: Coolify Secret Sync

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "discover, inspect, test, or sync"
        required: true
        default: "discover"
        type: choice
        options:
          - discover
          - inspect_ops_envs
          - inspect_ops_deployment
          - test_ops_quote_ready_token
          - sync
          - delete_env
          - sync_ops_quote_ready_token
          - sync_ops_arrival_label_scheduler_token
          - delete_ops_arrival_label_scheduler_token
          - sync_ops_arrival_label_browser_worker_token
          - delete_ops_arrival_label_browser_worker_token
          - sync_ops_microsoft_graph_secret
          - delete_ops_microsoft_graph_secret_next
          - enable_voice_live_copilot
          - disable_voice_live_copilot
      ops_kind:
        description: "Ops resource kind"
        required: false
        default: "application"
        type: choice
        options:
          - application
          - service
      ops_uuid:
        description: "Ops Coolify resource UUID"
        required: false
      n8n_kind:
        description: "n8n resource kind"
        required: false
        default: "service"
        type: choice
        options:
          - application
          - service
      n8n_uuid:
        description: "n8n Coolify resource UUID"
        required: false
      deployment_uuid:
        description: "Coolify deployment UUID"
        required: false

jobs:
  coolify:
    name: Discover or sync Coolify secret
    runs-on: ubuntu-latest
    steps:
      - name: Validate secrets
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          QUOTE_READY_SIZE_LADDER_AGENT_API_TOKEN: ${{ secrets.QUOTE_READY_SIZE_LADDER_AGENT_API_TOKEN }}
          ARRIVAL_LABEL_LOCAL_SCHEDULER_API_TOKEN: ${{ secrets.ARRIVAL_LABEL_LOCAL_SCHEDULER_API_TOKEN }}
          ARRIVAL_LABEL_BROWSER_WORKER_API_TOKEN: ${{ secrets.ARRIVAL_LABEL_BROWSER_WORKER_API_TOKEN }}
          MICROSOFT_GRAPH_CLIENT_SECRET: ${{ secrets.MICROSOFT_GRAPH_CLIENT_SECRET }}
        run: |
          test -n "$COOLIFY_DEPLOY_WEBHOOK" || { echo "COOLIFY_DEPLOY_WEBHOOK missing"; exit 1; }
          test -n "$COOLIFY_API_TOKEN" || { echo "COOLIFY_API_TOKEN missing"; exit 1; }

      - name: Run Coolify operation
        env:
          MODE: ${{ inputs.mode }}
          OPS_KIND: ${{ inputs.ops_kind }}
          OPS_UUID: ${{ inputs.ops_uuid }}
          N8N_KIND: ${{ inputs.n8n_kind }}
          N8N_UUID: ${{ inputs.n8n_uuid }}
          DEPLOYMENT_UUID: ${{ inputs.deployment_uuid }}
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          QUOTE_READY_SIZE_LADDER_AGENT_API_TOKEN: ${{ secrets.QUOTE_READY_SIZE_LADDER_AGENT_API_TOKEN }}
          ARRIVAL_LABEL_LOCAL_SCHEDULER_API_TOKEN: ${{ secrets.ARRIVAL_LABEL_LOCAL_SCHEDULER_API_TOKEN }}
          ARRIVAL_LABEL_BROWSER_WORKER_API_TOKEN: ${{ secrets.ARRIVAL_LABEL_BROWSER_WORKER_API_TOKEN }}
          MICROSOFT_GRAPH_CLIENT_SECRET: ${{ secrets.MICROSOFT_GRAPH_CLIENT_SECRET }}
        run: |
          node <<'NODE'
          const crypto = require("crypto");

          (async () => {
          const mode = process.env.MODE || "discover";
          const deployWebhook = process.env.COOLIFY_DEPLOY_WEBHOOK || "";
          const apiToken = process.env.COOLIFY_API_TOKEN || "";
          const deployUrl = new URL(deployWebhook);
          const baseUrl = `${deployUrl.origin}/api/v1`;

          async function coolify(path, options = {}) {
            const response = await fetch(`${baseUrl}${path}`, {
              ...options,
              headers: {
                Authorization: `Bearer ${apiToken}`,
                Accept: "application/json",
                "Content-Type": "application/json",
                ...(options.headers || {}),
              },
            });
            const text = await response.text();
            let body;
            try {
              body = text ? JSON.parse(text) : null;
            } catch {
              body = text;
            }
            if (!response.ok) {
              const detail = typeof body === "string" ? body.slice(0, 300) : JSON.stringify(body).slice(0, 500);
              throw new Error(`${options.method || "GET"} ${path} failed ${response.status}: ${detail}`);
            }
            return body;
          }

          function summarize(kind, rows) {
            return (Array.isArray(rows) ? rows : []).map((row) => ({
              kind,
              uuid: row.uuid,
              name: row.name || row.fqdn || row.description || null,
              domains: row.domains || row.fqdn || row.fqdns || null,
              repository: row.git_repository || row.repository || null,
              status: row.status || null,
            }));
          }

          function endpoint(kind, uuid, suffix = "") {
            if (kind === "application") return `/applications/${uuid}${suffix}`;
            if (kind === "service") return `/services/${uuid}${suffix}`;
            throw new Error(`Unsupported kind: ${kind}`);
          }

          function redactSensitiveFields(value) {
            if (Array.isArray(value)) return value.map(redactSensitiveFields);
            if (!value || typeof value !== "object") return value;
            return Object.fromEntries(Object.entries(value).map(([key, entry]) => {
              if (/(password|secret|token|private[_-]?key|webhook)/i.test(key)) {
                return [key, entry ? "[redacted]" : entry];
              }
              return [key, redactSensitiveFields(entry)];
            }));
          }

          async function upsertEnv(kind, uuid, key, value) {
            const payload = {
              key,
              value,
              is_preview: false,
              is_literal: true,
              is_multiline: false,
              is_shown_once: true,
            };
            if (kind === "application") {
              payload.is_runtime = true;
              payload.is_buildtime = false;
            }
            try {
              await coolify(endpoint(kind, uuid, "/envs"), {
                method: "PATCH",
                body: JSON.stringify(payload),
              });
              return "updated";
            } catch (error) {
              if (!String(error.message).includes("404")) throw error;
              await coolify(endpoint(kind, uuid, "/envs"), {
                method: "POST",
                body: JSON.stringify(payload),
              });
              return "created";
            }
          }

          function envSummary(env) {
            const value = String(env.value || env.real_value || "");
            return {
              key: env.key,
              uuid: env.uuid || null,
              isPreview: env.is_preview ?? null,
              isLiteral: env.is_literal ?? null,
              isMultiline: env.is_multiline ?? null,
              isRuntime: env.is_runtime ?? null,
              isBuildtime: env.is_buildtime ?? null,
              valueLength: value.length,
              valueSha256Prefix: value ? crypto.createHash("sha256").update(value).digest("hex").slice(0, 12) : null,
            };
          }

          async function testOpsQuoteReadyToken(token) {
            const response = await fetch("https://ops.neontrip.de/api/ops/customer-records/price-predictions", {
              method: "POST",
              headers: {
                Accept: "application/json",
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify({
                action: "prepare_quote_ready_size_ladder",
                operatorName: "Quote Ready Size Ladder Gate Token Test",
                quoteReadySizeLadder: {
                  trelloCard: "",
                  persist: false,
                  projectToTrello: false,
                  commentToTrello: false,
                },
              }),
            });
            const text = await response.text();
            let body;
            try {
              body = text ? JSON.parse(text) : null;
            } catch {
              body = text;
            }
            return {
              status: response.status,
              ok: response.ok,
              unauthorized: response.status === 401,
              bodyPreview: typeof body === "string" ? body.slice(0, 200) : JSON.stringify(body).slice(0, 300),
            };
          }

          async function restart(kind, uuid) {
            await coolify(endpoint(kind, uuid, "/restart"), { method: "POST" });
          }

          async function deleteEnv(kind, uuid, key) {
            const envs = await coolify(endpoint(kind, uuid, "/envs"));
            const match = (Array.isArray(envs) ? envs : []).find((env) => env.key === key);
            if (!match?.uuid) return "not_found";
            await coolify(endpoint(kind, uuid, `/envs/${match.uuid}`), { method: "DELETE" });
            return "deleted";
          }

          if (mode === "discover") {
            const [applications, services] = await Promise.all([
              coolify("/applications"),
              coolify("/services"),
            ]);
            const rows = [
              ...summarize("application", applications),
              ...summarize("service", services),
            ];
            const interesting = rows.filter((row) => {
              const haystack = JSON.stringify(row).toLowerCase();
              return haystack.includes("ops") || haystack.includes("n8n") || haystack.includes("neontrip");
            });
            console.log(JSON.stringify({
              coolifyOrigin: new URL(baseUrl).origin,
              count: rows.length,
              interesting,
            }, null, 2));
            return;
          }

          if (mode === "inspect_ops_envs") {
            const opsKind = process.env.OPS_KIND || "application";
            const opsUuid = process.env.OPS_UUID || "";
            if (!opsUuid) throw new Error("inspect_ops_envs requires ops_uuid");
            const envs = await coolify(endpoint(opsKind, opsUuid, "/envs"));
            const interestingKeys = new Set([
              "SUPPLIER_PRICE_REVIEW_AGENT_API_TOKEN",
              "OPS_INTERNAL_API_KEY",
              "QUOTE_INTERNAL_API_TOKEN",
              "SUPPLIER_SALES_AGENT_API_TOKEN",
              "NEONTRIP_OFFERS_INTERNAL_API_KEY",
              "QUOTE_READY_SIZE_LADDER_AGENT_API_TOKEN",
              "ARRIVAL_LABEL_LOCAL_SCHEDULER_API_TOKEN",
              "ARRIVAL_LABEL_BROWSER_WORKER_API_TOKEN",
              "VOICE_LIVE_COPILOT_ENABLED",
            ]);
            console.log(JSON.stringify({
              ok: true,
              ops: { kind: opsKind, uuid: opsUuid },
              envs: (Array.isArray(envs) ? envs : [])
                .filter((env) => interestingKeys.has(env.key))
                .map(envSummary),
            }, null, 2));
            return;
          }

          if (mode === "inspect_ops_deployment") {
            const opsKind = process.env.OPS_KIND || "application";
            const opsUuid = process.env.OPS_UUID || "";
            const deploymentUuid = process.env.DEPLOYMENT_UUID || "";
            if (!opsUuid) throw new Error("inspect_ops_deployment requires ops_uuid");
            const attempts = [];
            async function tryPath(path) {
              try {
                attempts.push({ path, ok: true, body: redactSensitiveFields(await coolify(path)) });
              } catch (error) {
                attempts.push({ path, ok: false, error: String(error.message || error).slice(0, 500) });
              }
            }
            await tryPath(endpoint(opsKind, opsUuid));
            await tryPath(endpoint(opsKind, opsUuid, "/deployments"));
            if (deploymentUuid) {
              await tryPath(`/deployments/${deploymentUuid}`);
              await tryPath(`/deployments?uuid=${encodeURIComponent(deploymentUuid)}`);
            }
            console.log(JSON.stringify({
              ok: true,
              ops: { kind: opsKind, uuid: opsUuid },
              deploymentUuid: deploymentUuid || null,
              attempts,
            }, null, 2));
            return;
          }

          if (mode === "test_ops_quote_ready_token") {
            const token = process.env.QUOTE_READY_SIZE_LADDER_AGENT_API_TOKEN || "";
            if (!token) throw new Error("QUOTE_READY_SIZE_LADDER_AGENT_API_TOKEN GitHub secret missing");
            const result = await testOpsQuoteReadyToken(token);
            console.log(JSON.stringify({
              ok: true,
              testedKey: "QUOTE_READY_SIZE_LADDER_AGENT_API_TOKEN",
              tokenLength: token.length,
              tokenSha256Prefix: crypto.createHash("sha256").update(token).digest("hex").slice(0, 12),
              result,
            }, null, 2));
            return;
          }

          if (mode === "delete_env") {
            const n8nKind = process.env.N8N_KIND || "service";
            const n8nUuid = process.env.N8N_UUID || "";
            if (!n8nUuid) throw new Error("delete_env requires n8n_uuid");
            const key = "SUPPLIER_PRICE_REVIEW_AGENT_API_TOKEN";
            const result = await deleteEnv(n8nKind, n8nUuid, key);
            await restart(n8nKind, n8nUuid);
            console.log(JSON.stringify({
              ok: true,
              deletedKey: key,
              n8n: { kind: n8nKind, uuid: n8nUuid, result, restarted: true },
            }, null, 2));
            return;
          }

          if (mode === "sync_ops_quote_ready_token") {
            const opsKind = process.env.OPS_KIND || "application";
            const opsUuid = process.env.OPS_UUID || "";
            const token = process.env.QUOTE_READY_SIZE_LADDER_AGENT_API_TOKEN || "";
            if (!opsUuid) throw new Error("sync_ops_quote_ready_token requires ops_uuid");
            if (!token) throw new Error("QUOTE_READY_SIZE_LADDER_AGENT_API_TOKEN GitHub secret missing");
            const key = "QUOTE_READY_SIZE_LADDER_AGENT_API_TOKEN";
            const result = await upsertEnv(opsKind, opsUuid, key, token);
            await restart(opsKind, opsUuid);
            console.log(JSON.stringify({
              ok: true,
              syncedKey: key,
              ops: { kind: opsKind, uuid: opsUuid, result, restarted: true },
            }, null, 2));
            return;
          }

          if (mode === "sync_ops_arrival_label_scheduler_token") {
            const opsKind = process.env.OPS_KIND || "application";
            const opsUuid = process.env.OPS_UUID || "";
            const token = process.env.ARRIVAL_LABEL_LOCAL_SCHEDULER_API_TOKEN || "";
            if (!opsUuid) throw new Error("sync_ops_arrival_label_scheduler_token requires ops_uuid");
            if (token.length < 32) throw new Error("ARRIVAL_LABEL_LOCAL_SCHEDULER_API_TOKEN GitHub secret missing or too short");
            const key = "ARRIVAL_LABEL_LOCAL_SCHEDULER_API_TOKEN";
            const envs = await coolify(endpoint(opsKind, opsUuid, "/envs"));
            const previous = (Array.isArray(envs) ? envs : []).find((env) => env.key === key);
            const result = await upsertEnv(opsKind, opsUuid, key, token);
            await restart(opsKind, opsUuid);
            console.log(JSON.stringify({
              ok: true,
              syncedKey: key,
              previous: previous ? envSummary(previous) : null,
              current: {
                valueLength: token.length,
                valueSha256Prefix: crypto.createHash("sha256").update(token).digest("hex").slice(0, 12),
              },
              ops: { kind: opsKind, uuid: opsUuid, result, restarted: true },
            }, null, 2));
            return;
          }

          if (mode === "delete_ops_arrival_label_scheduler_token") {
            const opsKind = process.env.OPS_KIND || "application";
            const opsUuid = process.env.OPS_UUID || "";
            if (!opsUuid) throw new Error("delete_ops_arrival_label_scheduler_token requires ops_uuid");
            const key = "ARRIVAL_LABEL_LOCAL_SCHEDULER_API_TOKEN";
            const result = await deleteEnv(opsKind, opsUuid, key);
            await restart(opsKind, opsUuid);
            console.log(JSON.stringify({
              ok: true,
              deletedKey: key,
              ops: { kind: opsKind, uuid: opsUuid, result, restarted: true },
            }, null, 2));
            return;
          }

          if (mode === "sync_ops_arrival_label_browser_worker_token") {
            const opsKind = process.env.OPS_KIND || "application";
            const opsUuid = process.env.OPS_UUID || "";
            const token = process.env.ARRIVAL_LABEL_BROWSER_WORKER_API_TOKEN || "";
            if (!opsUuid) throw new Error("sync_ops_arrival_label_browser_worker_token requires ops_uuid");
            if (token.length < 32) throw new Error("ARRIVAL_LABEL_BROWSER_WORKER_API_TOKEN GitHub secret missing or too short");
            const key = "ARRIVAL_LABEL_BROWSER_WORKER_API_TOKEN";
            const envs = await coolify(endpoint(opsKind, opsUuid, "/envs"));
            const previous = (Array.isArray(envs) ? envs : []).find((env) => env.key === key);
            const result = await upsertEnv(opsKind, opsUuid, key, token);
            await restart(opsKind, opsUuid);
            console.log(JSON.stringify({
              ok: true,
              syncedKey: key,
              previous: previous ? envSummary(previous) : null,
              current: {
                valueLength: token.length,
                valueSha256Prefix: crypto.createHash("sha256").update(token).digest("hex").slice(0, 12),
              },
              ops: { kind: opsKind, uuid: opsUuid, result, restarted: true },
            }, null, 2));
            return;
          }

          if (mode === "delete_ops_arrival_label_browser_worker_token") {
            const opsKind = process.env.OPS_KIND || "application";
            const opsUuid = process.env.OPS_UUID || "";
            if (!opsUuid) throw new Error("delete_ops_arrival_label_browser_worker_token requires ops_uuid");
            const key = "ARRIVAL_LABEL_BROWSER_WORKER_API_TOKEN";
            const result = await deleteEnv(opsKind, opsUuid, key);
            await restart(opsKind, opsUuid);
            console.log(JSON.stringify({
              ok: true,
              deletedKey: key,
              ops: { kind: opsKind, uuid: opsUuid, result, restarted: true },
            }, null, 2));
            return;
          }

          if (mode === "sync_ops_microsoft_graph_secret") {
            const opsKind = process.env.OPS_KIND || "application";
            const opsUuid = process.env.OPS_UUID || "";
            const secret = process.env.MICROSOFT_GRAPH_CLIENT_SECRET || "";
            const clientId = "27c78a52-b5e3-4c54-95a6-059076cda09d";
            if (!opsUuid) throw new Error("sync_ops_microsoft_graph_secret requires ops_uuid");
            if (secret.length < 32) throw new Error("MICROSOFT_GRAPH_CLIENT_SECRET GitHub secret missing or too short");
            const key = "MICROSOFT_GRAPH_CLIENT_SECRET_NEXT";
            const clientIdKey = "MICROSOFT_GRAPH_CLIENT_ID_NEXT";
            const envs = await coolify(endpoint(opsKind, opsUuid, "/envs"));
            const previous = (Array.isArray(envs) ? envs : []).find((env) => env.key === key);
            const previousClientId = (Array.isArray(envs) ? envs : []).find((env) => env.key === clientIdKey);
            const result = await upsertEnv(opsKind, opsUuid, key, secret);
            const clientIdResult = await upsertEnv(opsKind, opsUuid, clientIdKey, clientId);
            await restart(opsKind, opsUuid);
            console.log(JSON.stringify({
              ok: true,
              syncedKeys: [key, clientIdKey],
              previous: {
                secret: previous ? envSummary(previous) : null,
                clientId: previousClientId ? envSummary(previousClientId) : null,
              },
              current: {
                valueLength: secret.length,
                valueSha256Prefix: crypto.createHash("sha256").update(secret).digest("hex").slice(0, 12),
                clientId,
              },
              fallbackKeyPreserved: "MICROSOFT_GRAPH_CLIENT_SECRET",
              fallbackClientIdKeyPreserved: "MICROSOFT_GRAPH_CLIENT_ID",
              ops: { kind: opsKind, uuid: opsUuid, result, clientIdResult, restarted: true },
            }, null, 2));
            return;
          }

          if (mode === "delete_ops_microsoft_graph_secret_next") {
            const opsKind = process.env.OPS_KIND || "application";
            const opsUuid = process.env.OPS_UUID || "";
            if (!opsUuid) throw new Error("delete_ops_microsoft_graph_secret_next requires ops_uuid");
            const keys = ["MICROSOFT_GRAPH_CLIENT_SECRET_NEXT", "MICROSOFT_GRAPH_CLIENT_ID_NEXT"];
            const results = {};
            for (const key of keys) results[key] = await deleteEnv(opsKind, opsUuid, key);
            await restart(opsKind, opsUuid);
            console.log(JSON.stringify({
              ok: true,
              deletedKeys: keys,
              fallbackKeyRestored: "MICROSOFT_GRAPH_CLIENT_SECRET",
              fallbackClientIdKeyRestored: "MICROSOFT_GRAPH_CLIENT_ID",
              ops: { kind: opsKind, uuid: opsUuid, results, restarted: true },
            }, null, 2));
            return;
          }

          if (mode === "enable_voice_live_copilot" || mode === "disable_voice_live_copilot") {
            const opsKind = process.env.OPS_KIND || "application";
            const opsUuid = process.env.OPS_UUID || "";
            if (!opsUuid) throw new Error(`${mode} requires ops_uuid`);
            const key = "VOICE_LIVE_COPILOT_ENABLED";
            const desiredValue = mode === "enable_voice_live_copilot" ? "true" : "false";
            const envs = await coolify(endpoint(opsKind, opsUuid, "/envs"));
            const current = (Array.isArray(envs) ? envs : []).find((env) => env.key === key);
            const currentValue = String(current?.value || current?.real_value || "").trim().toLowerCase();
            let result = "unchanged";
            let restarted = false;
            if (currentValue !== desiredValue) {
              result = await upsertEnv(opsKind, opsUuid, key, desiredValue);
              await restart(opsKind, opsUuid);
              restarted = true;
            }
            console.log(JSON.stringify({
              ok: true,
              configuredKey: key,
              enabled: desiredValue === "true",
              ops: { kind: opsKind, uuid: opsUuid, result, restarted },
            }, null, 2));
            return;
          }

          if (mode !== "sync") throw new Error(`Unsupported mode: ${mode}`);
          const opsKind = process.env.OPS_KIND || "application";
          const n8nKind = process.env.N8N_KIND || "service";
          const opsUuid = process.env.OPS_UUID || "";
          const n8nUuid = process.env.N8N_UUID || "";
          if (!opsUuid || !n8nUuid) throw new Error("sync requires ops_uuid and n8n_uuid");

          const token = `ntq_${crypto.randomBytes(36).toString("base64url")}`;
          const key = "SUPPLIER_PRICE_REVIEW_AGENT_API_TOKEN";
          const opsResult = await upsertEnv(opsKind, opsUuid, key, token);
          const n8nResult = await upsertEnv(n8nKind, n8nUuid, key, token);
          await restart(opsKind, opsUuid);
          await restart(n8nKind, n8nUuid);
          console.log(JSON.stringify({
            ok: true,
            syncedKey: key,
            ops: { kind: opsKind, uuid: opsUuid, result: opsResult, restarted: true },
            n8n: { kind: n8nKind, uuid: n8nUuid, result: n8nResult, restarted: true },
          }, null, 2));
          })().catch((error) => {
            console.error(error.message || error);
            process.exit(1);
          });
          NODE
