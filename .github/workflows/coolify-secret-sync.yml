name: Coolify Secret Sync

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "discover, inspect, test, or sync"
        required: true
        default: "discover"
        type: choice
        options:
          - discover
          - discover_control_tower
          - inspect_control_tower_envs
          - inspect_control_tower_deployments
          - deploy_control_tower_resource
          - sync_control_tower_mockup_credentials
          - delete_control_tower_mockup_credentials
          - sync_control_tower_graph_credentials
          - delete_control_tower_graph_credentials
          - rotate_control_tower_graph_credentials_to_active_ops
          - rollback_control_tower_graph_credentials_rotation
          - sync_control_tower_n8n_trigger_allowlist
          - delete_control_tower_n8n_trigger_allowlist
          - inspect_ops_envs
          - inspect_ops_deployment
          - test_ops_quote_ready_token
          - sync
          - delete_env
          - sync_ops_eu_supplier_config
          - sync_ops_quote_ready_token
          - sync_ops_control_tower_portal_token
          - delete_ops_control_tower_portal_token
          - sync_ops_arrival_label_scheduler_token
          - delete_ops_arrival_label_scheduler_token
          - sync_ops_arrival_label_browser_worker_token
          - delete_ops_arrival_label_browser_worker_token
          - sync_ops_arrival_label_print_worker_token
          - delete_ops_arrival_label_print_worker_token
          - enable_ops_arrival_label_writes
          - disable_ops_arrival_label_writes
          - sync_ops_microsoft_graph_secret
          - delete_ops_microsoft_graph_secret_next
          - enable_voice_live_copilot
          - disable_voice_live_copilot
      ops_kind:
        description: "Ops resource kind"
        required: false
        default: "application"
        type: choice
        options:
          - application
          - service
      ops_uuid:
        description: "Ops Coolify resource UUID"
        required: false
      n8n_kind:
        description: "n8n resource kind"
        required: false
        default: "service"
        type: choice
        options:
          - application
          - service
      n8n_uuid:
        description: "n8n Coolify resource UUID"
        required: false
      deployment_uuid:
        description: "Coolify deployment UUID"
        required: false
      control_tower_kind:
        description: "Control Tower Coolify resource kind"
        required: false
        default: "application"
        type: choice
        options:
          - application
          - service
      control_tower_uuid:
        description: "Control Tower action resource UUID"
        required: false
      rollback_keys:
        description: "Comma-separated created keys from a prior Control Tower sync receipt"
        required: false
      expected_commit:
        description: "Exact 40-character Control Tower main commit to deploy"
        required: false
      rollback_commit:
        description: "Previously accepted exact Control Tower commit"
        required: false
      control_tower_role:
        description: "Expected CONTROL_TOWER_PROCESS_ROLE"
        required: false
        default: "action"
        type: choice
        options:
          - web
          - worker
          - action
          - release
          - backup

jobs:
  coolify:
    name: Discover or sync Coolify secret
    runs-on: ubuntu-latest
    steps:
      - name: Validate secrets
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          QUOTE_READY_SIZE_LADDER_AGENT_API_TOKEN: ${{ secrets.QUOTE_READY_SIZE_LADDER_AGENT_API_TOKEN }}
          ARRIVAL_LABEL_LOCAL_SCHEDULER_API_TOKEN: ${{ secrets.ARRIVAL_LABEL_LOCAL_SCHEDULER_API_TOKEN }}
          ARRIVAL_LABEL_BROWSER_WORKER_API_TOKEN: ${{ secrets.ARRIVAL_LABEL_BROWSER_WORKER_API_TOKEN }}
          ARRIVAL_LABEL_PRINT_API_TOKEN: ${{ secrets.ARRIVAL_LABEL_PRINT_API_TOKEN }}
          MICROSOFT_GRAPH_CLIENT_SECRET: ${{ secrets.MICROSOFT_GRAPH_CLIENT_SECRET }}
        run: |
          test -n "$COOLIFY_DEPLOY_WEBHOOK" || { echo "COOLIFY_DEPLOY_WEBHOOK missing"; exit 1; }
          test -n "$COOLIFY_API_TOKEN" || { echo "COOLIFY_API_TOKEN missing"; exit 1; }

      - name: Run Coolify operation
        env:
          MODE: ${{ inputs.mode }}
          OPS_KIND: ${{ inputs.ops_kind }}
          OPS_UUID: ${{ inputs.ops_uuid }}
          N8N_KIND: ${{ inputs.n8n_kind }}
          N8N_UUID: ${{ inputs.n8n_uuid }}
          DEPLOYMENT_UUID: ${{ inputs.deployment_uuid }}
          CONTROL_TOWER_KIND: ${{ inputs.control_tower_kind }}
          CONTROL_TOWER_UUID: ${{ inputs.control_tower_uuid }}
          ROLLBACK_KEYS: ${{ inputs.rollback_keys }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          ROLLBACK_COMMIT: ${{ inputs.rollback_commit }}
          CONTROL_TOWER_ROLE: ${{ inputs.control_tower_role }}
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          QUOTE_READY_SIZE_LADDER_AGENT_API_TOKEN: ${{ secrets.QUOTE_READY_SIZE_LADDER_AGENT_API_TOKEN }}
          ARRIVAL_LABEL_LOCAL_SCHEDULER_API_TOKEN: ${{ secrets.ARRIVAL_LABEL_LOCAL_SCHEDULER_API_TOKEN }}
          ARRIVAL_LABEL_BROWSER_WORKER_API_TOKEN: ${{ secrets.ARRIVAL_LABEL_BROWSER_WORKER_API_TOKEN }}
          ARRIVAL_LABEL_PRINT_API_TOKEN: ${{ secrets.ARRIVAL_LABEL_PRINT_API_TOKEN }}
          MICROSOFT_GRAPH_CLIENT_SECRET: ${{ secrets.MICROSOFT_GRAPH_CLIENT_SECRET }}
          CONTROL_TOWER_OPS_PORTAL_TOKEN: ${{ secrets.CONTROL_TOWER_OPS_PORTAL_TOKEN }}
          CONTROL_TOWER_OPS_CF_ACCESS_CLIENT_ID: ${{ secrets.CONTROL_TOWER_OPS_CF_ACCESS_CLIENT_ID }}
          CONTROL_TOWER_OPS_CF_ACCESS_CLIENT_SECRET: ${{ secrets.CONTROL_TOWER_OPS_CF_ACCESS_CLIENT_SECRET }}
        run: |
          node <<'NODE'
          const crypto = require("crypto");

          (async () => {
          const mode = process.env.MODE || "discover";
          const deployWebhook = process.env.COOLIFY_DEPLOY_WEBHOOK || "";
          const apiToken = process.env.COOLIFY_API_TOKEN || "";
          const deployUrl = new URL(deployWebhook);
          const baseUrl = `${deployUrl.origin}/api/v1`;

          async function coolify(path, options = {}) {
            const response = await fetch(`${baseUrl}${path}`, {
              ...options,
              headers: {
                Authorization: `Bearer ${apiToken}`,
                Accept: "application/json",
                "Content-Type": "application/json",
                ...(options.headers || {}),
              },
            });
            const text = await response.text();
            let body;
            try {
              body = text ? JSON.parse(text) : null;
            } catch {
              body = text;
            }
            if (!response.ok) {
              const detail = typeof body === "string" ? body.slice(0, 300) : JSON.stringify(body).slice(0, 500);
              throw new Error(`${options.method || "GET"} ${path} failed ${response.status}: ${detail}`);
            }
            return body;
          }

          function summarize(kind, rows) {
            return (Array.isArray(rows) ? rows : []).map((row) => ({
              kind,
              uuid: row.uuid,
              name: row.name || row.fqdn || row.description || null,
              domains: row.domains || row.fqdn || row.fqdns || null,
              repository: row.git_repository || row.repository || null,
              status: row.status || null,
            }));
          }

          function endpoint(kind, uuid, suffix = "") {
            if (kind === "application") return `/applications/${uuid}${suffix}`;
            if (kind === "service") return `/services/${uuid}${suffix}`;
            throw new Error(`Unsupported kind: ${kind}`);
          }

          function redactSensitiveFields(value) {
            if (Array.isArray(value)) return value.map(redactSensitiveFields);
            if (!value || typeof value !== "object") return value;
            return Object.fromEntries(Object.entries(value).map(([key, entry]) => {
              if (/(password|secret|token|private[_-]?key|webhook)/i.test(key)) {
                return [key, entry ? "[redacted]" : entry];
              }
              return [key, redactSensitiveFields(entry)];
            }));
          }

          async function upsertEnv(kind, uuid, key, value) {
            const payload = {
              key,
              value,
              is_preview: false,
              is_literal: true,
              is_multiline: false,
              is_shown_once: true,
            };
            if (kind === "application") {
              payload.is_runtime = true;
              payload.is_buildtime = false;
            }
            try {
              await coolify(endpoint(kind, uuid, "/envs"), {
                method: "PATCH",
                body: JSON.stringify(payload),
              });
              return "updated";
            } catch (error) {
              if (!String(error.message).includes("404")) throw error;
              await coolify(endpoint(kind, uuid, "/envs"), {
                method: "POST",
                body: JSON.stringify(payload),
              });
              return "created";
            }
          }

          function envSummary(env) {
            const value = String(env.value || env.real_value || "");
            return {
              key: env.key,
              uuid: env.uuid || null,
              isPreview: env.is_preview ?? null,
              isLiteral: env.is_literal ?? null,
              isMultiline: env.is_multiline ?? null,
              isRuntime: env.is_runtime ?? null,
              isBuildtime: env.is_buildtime ?? null,
              valueLength: value.length,
              valueSha256Prefix: value ? crypto.createHash("sha256").update(value).digest("hex").slice(0, 12) : null,
            };
          }

          async function testOpsQuoteReadyToken(token) {
            const response = await fetch("https://ops.neontrip.de/api/ops/customer-records/price-predictions", {
              method: "POST",
              headers: {
                Accept: "application/json",
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify({
                action: "prepare_quote_ready_size_ladder",
                operatorName: "Quote Ready Size Ladder Gate Token Test",
                quoteReadySizeLadder: {
                  trelloCard: "",
                  persist: false,
                  projectToTrello: false,
                  commentToTrello: false,
                },
              }),
            });
            const text = await response.text();
            let body;
            try {
              body = text ? JSON.parse(text) : null;
            } catch {
              body = text;
            }
            return {
              status: response.status,
              ok: response.ok,
              unauthorized: response.status === 401,
              bodyPreview: typeof body === "string" ? body.slice(0, 200) : JSON.stringify(body).slice(0, 300),
            };
          }

          async function restart(kind, uuid) {
            await coolify(endpoint(kind, uuid, "/restart"), { method: "POST" });
          }

          async function deleteEnv(kind, uuid, key) {
            const envs = await coolify(endpoint(kind, uuid, "/envs"));
            const match = (Array.isArray(envs) ? envs : []).find((env) => env.key === key);
            if (!match?.uuid) return "not_found";
            await coolify(endpoint(kind, uuid, `/envs/${match.uuid}`), { method: "DELETE" });
            return "deleted";
          }

          async function controlTowerTarget(expectedRole) {
            const kind = process.env.CONTROL_TOWER_KIND || "application";
            const uuid = process.env.CONTROL_TOWER_UUID || "";
            if (!uuid) throw new Error(`${mode} requires control_tower_uuid`);
            const [resource, envs] = await Promise.all([
              coolify(endpoint(kind, uuid)),
              coolify(endpoint(kind, uuid, "/envs")),
            ]);
            const summary = summarize(kind, [resource])[0] || {};
            const identity = JSON.stringify(summary).toLowerCase();
            const role = (Array.isArray(envs) ? envs : []).find(
              (env) => env.key === "CONTROL_TOWER_PROCESS_ROLE",
            );
            const roleValue = String(role?.value || role?.real_value || "");
            if (
              !identity.includes("agent-control-tower") ||
              !identity.includes("178.105.60.191") ||
              roleValue !== expectedRole
            ) {
              throw new Error("refusing non-production Control Tower or wrong-role Coolify target");
            }
            return {
              kind,
              uuid,
              resource,
              summary,
              envs: Array.isArray(envs) ? envs : [],
            };
          }

          async function controlTowerActionTarget() {
            return controlTowerTarget("action");
          }

          if (mode === "discover") {
            const [applications, services] = await Promise.all([
              coolify("/applications"),
              coolify("/services"),
            ]);
            const rows = [
              ...summarize("application", applications),
              ...summarize("service", services),
            ];
            const interesting = rows.filter((row) => {
              const haystack = JSON.stringify(row).toLowerCase();
              return haystack.includes("ops") || haystack.includes("n8n") || haystack.includes("neontrip");
            });
            console.log(JSON.stringify({
              coolifyOrigin: new URL(baseUrl).origin,
              count: rows.length,
              interesting,
            }, null, 2));
            return;
          }

          if (mode === "discover_control_tower") {
            const [applications, services] = await Promise.all([
              coolify("/applications"),
              coolify("/services"),
            ]);
            const rows = [
              ...summarize("application", applications),
              ...summarize("service", services),
            ];
            const controlTower = rows.filter((row) => (
              JSON.stringify(row).toLowerCase().includes("agent-control-tower")
            ));
            console.log(JSON.stringify({
              ok: true,
              coolifyOrigin: new URL(baseUrl).origin,
              count: controlTower.length,
              controlTower,
            }, null, 2));
            return;
          }

          if (mode === "inspect_control_tower_envs") {
            const target = await controlTowerActionTarget();
            const keys = new Set([
              "CONTROL_TOWER_PROCESS_ROLE",
              "CONTROL_TOWER_OPS_BASE_URL",
              "CONTROL_TOWER_OPS_ALLOWED_HOSTS",
              "CONTROL_TOWER_OPS_ALLOW_HTTP",
              "CONTROL_TOWER_OPS_PORTAL_TOKEN",
              "CONTROL_TOWER_OPS_CF_ACCESS_CLIENT_ID",
              "CONTROL_TOWER_OPS_CF_ACCESS_CLIENT_SECRET",
              "CONTROL_TOWER_MOCKUP_VERIFICATION_TIMEOUT_SECONDS",
              "CONTROL_TOWER_MS_GRAPH_TENANT_ID",
              "CONTROL_TOWER_MS_GRAPH_CLIENT_ID",
              "CONTROL_TOWER_MS_GRAPH_CLIENT_SECRET",
              "CONTROL_TOWER_OUTLOOK_MAILBOX",
              "CONTROL_TOWER_N8N_ALLOWED_TRIGGER_WORKFLOW_IDS",
            ]);
            console.log(JSON.stringify({
              ok: true,
              target: target.summary,
              envs: target.envs
                .filter((env) => keys.has(env.key))
                .map(envSummary),
            }, null, 2));
            return;
          }

          if (mode === "inspect_control_tower_deployments") {
            const target = await controlTowerActionTarget();
            const body = await coolify("/deployments?skip=0&take=100");
            const rows = Array.isArray(body)
              ? body
              : Array.isArray(body?.deployments)
                ? body.deployments
                : Array.isArray(body?.data)
                  ? body.data
                  : Array.isArray(body?.data?.data)
                    ? body.data.data
                  : [];
            const deployments = rows
              .filter((row) => (
                String(row.resource_uuid || row.application_uuid || "") === target.uuid ||
                Number(row.application_id || row.resource_id || 0) === Number(target.resource.id || -1)
              ))
              .map((row) => ({
                uuid: row.deployment_uuid || row.uuid || null,
                resourceUuid: row.resource_uuid || row.application_uuid || null,
                status: row.status || null,
                commit: /^[a-f0-9]{40}$/i.test(String(row.commit || ""))
                  ? String(row.commit).toLowerCase()
                  : null,
                createdAt: row.created_at || null,
                finishedAt: row.finished_at || null,
              }));
            console.log(JSON.stringify({
              ok: true,
              target: target.summary,
              sourceShape: {
                type: Array.isArray(body) ? "array" : typeof body,
                keys: body && typeof body === "object" ? Object.keys(body) : [],
                rowCount: rows.length,
              },
              sample: rows.slice(0, 10).map((row) => ({
                id: row.id || null,
                uuid: row.deployment_uuid || row.uuid || null,
                applicationId: row.application_id || null,
                resourceId: row.resource_id || null,
                resourceUuid: row.resource_uuid || row.application_uuid || null,
                status: row.status || null,
                commit: /^[a-f0-9]{40}$/i.test(String(row.commit || ""))
                  ? String(row.commit).toLowerCase()
                  : null,
              })),
              deployments,
            }, null, 2));
            return;
          }

          if (mode === "deploy_control_tower_resource") {
            const expectedCommit = String(process.env.EXPECTED_COMMIT || "").toLowerCase();
            const rollbackCommit = String(process.env.ROLLBACK_COMMIT || "").toLowerCase();
            const expectedRole = String(process.env.CONTROL_TOWER_ROLE || "");
            if (!/^[a-f0-9]{40}$/.test(expectedCommit)) {
              throw new Error("deploy_control_tower_resource requires exact expected_commit");
            }
            if (!/^[a-f0-9]{40}$/.test(rollbackCommit)) {
              throw new Error("deploy_control_tower_resource requires exact rollback_commit");
            }
            if (!["web", "worker", "action", "release", "backup"].includes(expectedRole)) {
              throw new Error("deploy_control_tower_resource role is invalid");
            }
            const target = await controlTowerTarget(expectedRole);
            if (target.kind !== "application") {
              throw new Error("Control Tower deployment target must be an application");
            }
            const previous = {
              gitBranch: String(target.resource.git_branch || ""),
              gitCommitSha: String(target.resource.git_commit_sha || ""),
              rollbackCommit,
              status: String(target.resource.status || ""),
            };
            await coolify(endpoint(target.kind, target.uuid), {
              method: "PATCH",
              body: JSON.stringify({
                git_branch: "main",
                git_commit_sha: expectedCommit,
              }),
            });
            let deploymentUuid = "";
            try {
              const ticket = await coolify(
                `/deploy?uuid=${encodeURIComponent(target.uuid)}&force=false`,
              );
              const deployments = Array.isArray(ticket?.deployments) ? ticket.deployments : [];
              if (
                deployments.length !== 1 ||
                String(deployments[0]?.resource_uuid || "") !== target.uuid
              ) {
                throw new Error("Coolify returned an invalid deployment ticket");
              }
              deploymentUuid = String(deployments[0]?.deployment_uuid || "");
              if (!/^[A-Za-z0-9_-]{8,180}$/.test(deploymentUuid)) {
                throw new Error("Coolify deployment UUID is invalid");
              }
              const failureStatuses = new Set(["failed", "cancelled", "canceled", "error"]);
              const successStatuses = new Set(["finished", "completed", "success", "successful"]);
              let deployment = null;
              for (let attempt = 0; attempt < 180; attempt += 1) {
                deployment = await coolify(`/deployments/${deploymentUuid}`);
                const status = String(deployment?.status || "").toLowerCase();
                if (failureStatuses.has(status)) {
                  throw new Error(`Coolify deployment ended with status ${status}`);
                }
                if (successStatuses.has(status)) break;
                await new Promise((resolve) => setTimeout(resolve, 5_000));
              }
              const status = String(deployment?.status || "").toLowerCase();
              const commit = String(deployment?.commit || "").toLowerCase();
              if (!successStatuses.has(status)) {
                throw new Error("Coolify deployment verification timed out");
              }
              if (commit !== expectedCommit) {
                throw new Error("Coolify deployed a different commit");
              }
              let current = null;
              for (let attempt = 0; attempt < 24; attempt += 1) {
                current = await coolify(endpoint(target.kind, target.uuid));
                if (String(current?.status || "").includes("running:healthy")) {
                  break;
                }
                await new Promise((resolve) => setTimeout(resolve, 5_000));
              }
              if (!String(current?.status || "").includes("running:healthy")) {
                throw new Error("Control Tower resource is not healthy after deployment");
              }
              console.log(JSON.stringify({
                ok: true,
                target: target.summary,
                expectedCommit,
                deploymentUuid,
                deploymentStatus: status,
                deployedCommit: commit,
                resourceStatus: current.status,
                previous,
                rollback: {
                  mode: "deploy_control_tower_resource",
                  expectedCommit: rollbackCommit,
                  rollbackCommit: expectedCommit,
                  controlTowerRole: expectedRole,
                  controlTowerUuid: target.uuid,
                },
              }, null, 2));
              return;
            } catch (error) {
              await coolify(endpoint(target.kind, target.uuid), {
                method: "PATCH",
                body: JSON.stringify({
                  git_branch: previous.gitBranch || "main",
                  git_commit_sha: previous.gitCommitSha || rollbackCommit,
                }),
              });
              console.error(JSON.stringify({
                ok: false,
                target: target.summary,
                deploymentUuid: deploymentUuid || null,
                configurationRollbackApplied: true,
                rollbackCommit,
                error: String(error?.message || error).slice(0, 500),
              }));
              throw error;
            }
          }

          if (mode === "sync_control_tower_mockup_credentials") {
            const target = await controlTowerActionTarget();
            const expected = {
              CONTROL_TOWER_OPS_BASE_URL: "https://ops.neontrip.de",
              CONTROL_TOWER_OPS_ALLOWED_HOSTS: "ops.neontrip.de",
              CONTROL_TOWER_OPS_ALLOW_HTTP: "0",
              CONTROL_TOWER_OPS_PORTAL_TOKEN: process.env.CONTROL_TOWER_OPS_PORTAL_TOKEN || "",
              CONTROL_TOWER_OPS_CF_ACCESS_CLIENT_ID: process.env.CONTROL_TOWER_OPS_CF_ACCESS_CLIENT_ID || "",
              CONTROL_TOWER_OPS_CF_ACCESS_CLIENT_SECRET: process.env.CONTROL_TOWER_OPS_CF_ACCESS_CLIENT_SECRET || "",
              CONTROL_TOWER_MOCKUP_VERIFICATION_TIMEOUT_SECONDS: "180",
            };
            if (expected.CONTROL_TOWER_OPS_PORTAL_TOKEN.length < 48) {
              throw new Error("CONTROL_TOWER_OPS_PORTAL_TOKEN GitHub secret missing or too short");
            }
            if (
              !expected.CONTROL_TOWER_OPS_CF_ACCESS_CLIENT_ID ||
              !expected.CONTROL_TOWER_OPS_CF_ACCESS_CLIENT_SECRET
            ) {
              throw new Error("Control Tower Cloudflare Access GitHub secret pair missing");
            }
            const previous = {};
            const createdKeys = [];
            const results = {};
            for (const [key, value] of Object.entries(expected)) {
              const existing = target.envs.find((env) => env.key === key);
              const previousValue = String(existing?.value || existing?.real_value || "");
              previous[key] = existing ? envSummary(existing) : null;
              if (previousValue && previousValue !== value) {
                throw new Error(`${key} already exists with a different value; refusing destructive rotation`);
              }
            }
            for (const [key, value] of Object.entries(expected)) {
              const existing = target.envs.find((env) => env.key === key);
              const previousValue = String(existing?.value || existing?.real_value || "");
              if (previousValue) {
                results[key] = "unchanged";
              } else {
                results[key] = await upsertEnv(target.kind, target.uuid, key, value);
                createdKeys.push(key);
              }
            }
            if (createdKeys.length) await restart(target.kind, target.uuid);
            console.log(JSON.stringify({
              ok: true,
              target: target.summary,
              previous,
              current: Object.fromEntries(
                Object.entries(expected).map(([key, value]) => [
                  key,
                  {
                    valueLength: value.length,
                    valueSha256Prefix: crypto.createHash("sha256").update(value).digest("hex").slice(0, 12),
                  },
                ]),
              ),
              results,
              createdKeys,
              restarted: createdKeys.length > 0,
              rollback: {
                mode: "delete_control_tower_mockup_credentials",
                rollbackKeys: createdKeys.join(","),
              },
            }, null, 2));
            return;
          }

          if (mode === "delete_control_tower_mockup_credentials") {
            const target = await controlTowerActionTarget();
            const expected = {
              CONTROL_TOWER_OPS_BASE_URL: "https://ops.neontrip.de",
              CONTROL_TOWER_OPS_ALLOWED_HOSTS: "ops.neontrip.de",
              CONTROL_TOWER_OPS_ALLOW_HTTP: "0",
              CONTROL_TOWER_OPS_PORTAL_TOKEN: process.env.CONTROL_TOWER_OPS_PORTAL_TOKEN || "",
              CONTROL_TOWER_OPS_CF_ACCESS_CLIENT_ID: process.env.CONTROL_TOWER_OPS_CF_ACCESS_CLIENT_ID || "",
              CONTROL_TOWER_OPS_CF_ACCESS_CLIENT_SECRET: process.env.CONTROL_TOWER_OPS_CF_ACCESS_CLIENT_SECRET || "",
              CONTROL_TOWER_MOCKUP_VERIFICATION_TIMEOUT_SECONDS: "180",
            };
            const requested = Array.from(new Set(
              String(process.env.ROLLBACK_KEYS || "")
                .split(",")
                .map((value) => value.trim())
                .filter(Boolean),
            ));
            if (!requested.length) throw new Error("rollback_keys is required");
            if (requested.some((key) => !Object.hasOwn(expected, key))) {
