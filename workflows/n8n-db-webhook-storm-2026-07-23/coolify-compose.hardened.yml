services:
  n8n:
    image: "docker.n8n.io/n8nio/n8n:latest"
    environment:
      - SERVICE_URL_N8N_5678
      - "N8N_EDITOR_BASE_URL=${SERVICE_URL_N8N}"
      - "WEBHOOK_URL=${SERVICE_URL_N8N}"
      - "N8N_HOST=${SERVICE_URL_N8N}"
      - "GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Europe/Berlin}"
      - "TZ=${TZ:-Europe/Berlin}"
      - DB_TYPE=postgresdb
      - "DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}"
      - DB_POSTGRESDB_HOST=postgresql
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=$SERVICE_USER_POSTGRES
      - DB_POSTGRESDB_SCHEMA=public
      - DB_POSTGRESDB_PASSWORD=$SERVICE_PASSWORD_POSTGRES
      - DB_POSTGRESDB_POOL_SIZE=10
      - DB_POSTGRESDB_CONNECTION_TIMEOUT=30000
      - N8N_CONCURRENCY_PRODUCTION_LIMIT=5
      - N8N_TRUST_PROXY=true
      - "SHOPIFY_SALE_WEBHOOK_SECRET=${SHOPIFY_SALE_WEBHOOK_SECRET}"
      - "OPS_INTERNAL_API_KEY=${OPS_INTERNAL_API_KEY}"
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
      - N8N_GIT_NODE_DISABLE_BARE_REPOS=true
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=none
      - EXECUTIONS_DATA_SAVE_ON_PROGRESS=false
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=10000
      - EXECUTIONS_DATA_HARD_DELETE_BUFFER=1
    volumes:
      - "n8n-data:/home/node/.n8n"
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -qO- http://127.0.0.1:5678/healthz/readiness"
      interval: 5s
      timeout: 20s
      retries: 10
      start_period: 60s
    stop_grace_period: 60s
  postgresql:
    image: "postgres:16-alpine"
    volumes:
      - "postgresql-data:/var/lib/postgresql/data"
    environment:
      - POSTGRES_USER=$SERVICE_USER_POSTGRES
      - POSTGRES_PASSWORD=$SERVICE_PASSWORD_POSTGRES
      - "POSTGRES_DB=${POSTGRES_DB:-n8n}"
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      interval: 5s
      timeout: 20s
      retries: 10
      start_period: 30s
    stop_grace_period: 60s
