    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body { font-family: 'Inter', sans-serif; }

    /* Scroll reveal */
    .reveal { opacity: 0; transform: translateY(40px); transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1), transform 0.9s cubic-bezier(0.16, 1, 0.3, 1); }
    .reveal.visible { opacity: 1; transform: translateY(0); }
    /* Fallback: show content if JS fails */
    .no-js .reveal { opacity: 1; transform: none; transition: none; }
    .no-js .stagger-children > * { opacity: 1; transform: none; }

    /* Button hover effects */
    .btn-primary { transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease; }
    .btn-primary:hover { transform: scale(1.03) translateY(-2px); box-shadow: 0 10px 40px rgba(109, 40, 217, 0.3); }
    .btn-primary:active { transform: scale(0.98); }

    .btn-secondary { transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s ease; }
    .btn-secondary:hover { transform: scale(1.02); }

    /* Card hover lift */
    .card-hover { transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease; }
    .card-hover:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08); }

    /* Link underline animation */
    .link-animated { position: relative; }
    .link-animated::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 0; height: 1px; background: currentColor; transition: width 0.3s ease; }
    .link-animated:hover::after { width: 100%; }

    /* Image hover zoom */
    .img-zoom { overflow: hidden; }
    .img-zoom img { transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
    .img-zoom:hover img { transform: scale(1.05); }

    /* Stagger children animation (supports up to 15 children) */
    .stagger-children > * { opacity: 0; transform: translateY(20px); }
    .stagger-children.visible > *:nth-child(1) { animation: staggerIn 0.6s 0.05s forwards; }
    .stagger-children.visible > *:nth-child(2) { animation: staggerIn 0.6s 0.1s forwards; }
    .stagger-children.visible > *:nth-child(3) { animation: staggerIn 0.6s 0.15s forwards; }
    .stagger-children.visible > *:nth-child(4) { animation: staggerIn 0.6s 0.2s forwards; }
    .stagger-children.visible > *:nth-child(5) { animation: staggerIn 0.6s 0.25s forwards; }
    .stagger-children.visible > *:nth-child(6) { animation: staggerIn 0.6s 0.3s forwards; }
    .stagger-children.visible > *:nth-child(7) { animation: staggerIn 0.6s 0.35s forwards; }
    .stagger-children.visible > *:nth-child(8) { animation: staggerIn 0.6s 0.4s forwards; }
    .stagger-children.visible > *:nth-child(9) { animation: staggerIn 0.6s 0.45s forwards; }
    .stagger-children.visible > *:nth-child(10) { animation: staggerIn 0.6s 0.5s forwards; }
    .stagger-children.visible > *:nth-child(11) { animation: staggerIn 0.6s 0.55s forwards; }
    .stagger-children.visible > *:nth-child(12) { animation: staggerIn 0.6s 0.6s forwards; }
    .stagger-children.visible > *:nth-child(13) { animation: staggerIn 0.6s 0.65s forwards; }
    .stagger-children.visible > *:nth-child(14) { animation: staggerIn 0.6s 0.7s forwards; }
    .stagger-children.visible > *:nth-child(15) { animation: staggerIn 0.6s 0.75s forwards; }
    @keyframes staggerIn { to { opacity: 1; transform: translateY(0); } }

    /* Floating animation for decorative elements */
    .float { animation: float 6s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

    /* Pulse glow for CTAs — composited via pseudo-element */
    .pulse-glow { position: relative; }
    .pulse-glow::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: rgba(74, 222, 128, 0.5); opacity: 0; transform: scale(1); animation: pulseGlow 2s ease-in-out infinite; pointer-events: none; z-index: -1; }
    @keyframes pulseGlow { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 0; transform: scale(1.15); } }

    /* Text gradient animation — composited via translateX */
    .text-shimmer { position: relative; overflow: hidden; color: #0A0A0A; }
    .text-shimmer::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent 0%, #fa31a2 50%, transparent 100%); mix-blend-mode: lighten; transform: translateX(-100%); animation: shimmer 3s ease-in-out infinite; pointer-events: none; }
    @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

    /* Process Step Animations - using data attributes for reliable targeting */
    .process-icon {
      opacity: 0;
      transform: scale(0.5);
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.3s ease;
    }
    .process-step.visible .process-icon { opacity: 1; transform: scale(1); }
    .process-step[data-step="1"].visible .process-icon { transition-delay: 0.3s; }
    .process-step[data-step="2"].visible .process-icon { transition-delay: 1.0s; }
    .process-step[data-step="3"].visible .process-icon { transition-delay: 1.7s; }

    /* Process step fade in */
    .process-step { opacity: 0; transform: translateY(30px); transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1); }
    .process-step[data-step="1"].visible { opacity: 1; transform: translateY(0); transition-delay: 0.1s; }
    .process-step[data-step="2"].visible { opacity: 1; transform: translateY(0); transition-delay: 0.25s; }
    .process-step[data-step="3"].visible { opacity: 1; transform: translateY(0); transition-delay: 0.4s; }

    /* SVG ring draw animation */
    .process-ring-progress {
      stroke-dasharray: 289;
      stroke-dashoffset: 289;
    }
    .process-step .ring-glow {
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .process-step.glow .ring-glow {
      opacity: 1;
    }

    /* Connecting line animation */
    .process-line-wrapper { overflow: hidden; }
    .process-line {
      transform: scaleX(0);
      transform-origin: left;
    }

    /* Step number pulse on complete */
    @keyframes stepPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
    .process-step.glow .step-number { animation: stepPulse 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }

    /* Marquee */
    @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    .marquee-track { display: inline-flex; animation: marquee 35s linear infinite; }
    .marquee-track:hover { animation-play-state: paused; }
    .marquee-mask { -webkit-mask-image: linear-gradient(to right, transparent 0%, black 10%, black 90%, transparent 100%); mask-image: linear-gradient(to right, transparent 0%, black 10%, black 90%, transparent 100%); }

    /* Review Carousel - seamless infinite scroll */
    @keyframes reviewScroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .review-track { display: flex; width: max-content; }
    .review-track:hover { animation-play-state: paused; }

    /* Mobile: infinite marquee, edge-to-edge */
    @media (max-width: 767px) {
      #review-carousel {
        margin-left: -24px;
        margin-right: -24px;
      }
      #review-carousel .review-track > div {
        width: 260px;
      }
      #review-carousel .review-track > div p[class*="text-[15px]"] {
        font-size: 13px;
        line-height: 1.4;
        display: -webkit-box;
        -webkit-line-clamp: 4;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
    }
    .marquee-track-seamless { display: flex; animation: marquee 90s linear infinite !important; width: max-content; will-change: transform; }

    /* Product Carousel */
    .product-track { display: flex; gap: 24px; animation: marquee 25s linear infinite; }
    .product-track:hover { animation-play-state: paused; }

    /* Counter */
    [data-count] { font-variant-numeric: tabular-nums; }

    /* Form Steps */
    .form-step { display: none; }
    .form-step.active { display: block; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* FAQ */
    .faq-answer { max-height: 0; overflow: hidden; transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    .faq-item.active .faq-answer { max-height: 500px; }
    .faq-item.active .faq-icon { transform: rotate(45deg); }
    .faq-icon { transition: transform 0.3s ease; }

    /* Header - always dark, subtle blur on scroll */
    .header-scrolled { background: rgba(10,10,10,0.95) !important; -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }

    /* Contact Dropdown */
    #contact-dropdown.open { opacity: 1; visibility: visible; transform: translateY(0); }
    #contact-chevron.open { transform: rotate(180deg); }

    /* Arrow bounce animation */
    @keyframes arrow-bounce { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
    .arrow-animate { animation: arrow-bounce 1.5s ease-in-out infinite; }
    @keyframes arrow-bounce-down { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
    .arrow-bounce { animation: arrow-bounce-down 1.8s ease-in-out infinite; }

    /* Sticky Contact Card */
    .contact-sticky {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 50;
      opacity: 0;
      transform: translateX(100%);
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    .contact-sticky.visible {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }
    @media (max-width: 768px) {
      .contact-sticky { display: none; }
    }

    /* Mobile Sticky CTA */
    .mobile-sticky-cta {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 45;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    .mobile-sticky-cta.visible {
      transform: translateY(0);
      pointer-events: auto;
    }
    @media (min-width: 769px) {
      .mobile-sticky-cta { display: none; }
    }
    @keyframes online-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.5); }
      50% { box-shadow: 0 0 0 4px rgba(34,197,94,0); }
    }

    /* Project cards: hide text overlays on mobile */
    @media (max-width: 767px) {
      .card-overlay-mobile { display: none !important; }
      .card-header-desktop { display: none !important; }
    }

    /* Project Grid: show 6 on mobile, all on desktop. Expand with JS */
    @media (max-width: 767px) {
      #project-grid > a:nth-child(n+7) { display: none; }
      #project-grid.projects-expanded > a:nth-child(n+7) { display: block; }
    }

    /* Mobile Nav */
    #mobile-nav.open { opacity: 1; pointer-events: auto; }
    #mobile-nav .mobile-nav-link { opacity: 0; transform: translateY(20px); transition: opacity 0.4s ease, transform 0.4s ease; }
    #mobile-nav.open .mobile-nav-link { opacity: 1; transform: translateY(0); }
    #mobile-nav.open .mobile-nav-link:nth-child(1) { transition-delay: 0.05s; }
    #mobile-nav.open .mobile-nav-link:nth-child(2) { transition-delay: 0.1s; }
    #mobile-nav.open .mobile-nav-link:nth-child(3) { transition-delay: 0.15s; }
    #mobile-nav.open .mobile-nav-link:nth-child(4) { transition-delay: 0.2s; }
    #mobile-nav.open .mobile-nav-link:nth-child(5) { transition-delay: 0.25s; }
    #mobile-nav.open .mobile-nav-link:nth-child(6) { transition-delay: 0.3s; }

    /* Hamburger */
    .hamburger.active span:first-child { transform: rotate(45deg) translateY(3px); }
    .hamburger.active span:last-child { transform: rotate(-45deg) translateY(-3px); }

    /* Progress Bar */
    .progress-step { transition: all 0.3s ease; }
    .progress-step.active { background: #fa31a2; }
    .progress-step.completed { background: #fa31a2; }

    /* Header CTA Pulse */
    @keyframes cta-ring {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.35); opacity: 0; }
    }
    .header-cta { position: relative; }
    .header-cta::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 9999px;
      border: 2px solid #fa31a2;
      animation: cta-ring 3s ease-out infinite;
      pointer-events: none;
    }

    /* File Upload */
    .file-drop-zone { border: 2px dashed rgba(10,10,10,0.2); transition: all 0.3s ease; }
    .file-drop-zone:hover, .file-drop-zone.dragover { border-color: #0A0A0A; background: rgba(10,10,10,0.02); }

    /* Scroll Snap - enabled for full-screen sections */
    html { scroll-behavior: smooth; scroll-padding-top: 80px; }
    
    

    /* Hide scrollbar but keep functionality */
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }

    /* ── PREMIUM DESIGN LAYER ── */

    /* Neon text glow - disabled */
    .neon-glow {
      text-shadow: none;
    }

    /* Hero H1 sizes — double ID selector to beat pre-built Tailwind 28px !important */
    section#hero h1 { font-size: 36px !important; }
    @media (min-width: 768px) { section#hero h1 { font-size: 80px !important; } }

    /* Noise overlay for card-in-card dark sections */
    .noise-overlay { background-image: url('../assets/images/grain-texture.png'); background-size: 256px 256px; background-repeat: repeat; opacity: 0.05; pointer-events: none; }

    /* Grain texture overlay for dark sections — adds depth */
    .grain { position: relative; }
    .grain::after {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0.035;
      pointer-events: none;
      z-index: 1;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 200px;
    }

    /* Hero form accent glow — magnetic pull */
    .form-glow {
      box-shadow:
        0 0 0 1px rgba(129, 1, 128, 0.08),
        0 25px 60px -12px rgba(129, 1, 128, 0.25),
        0 0 120px rgba(129, 1, 128, 0.06);
      border-top: 2px solid rgba(129, 1, 128, 0.4);
    }

    /* Project card — staggered scroll reveal */
    .project-card {
      opacity: 0;
      transform: translateY(30px) scale(0.94);
      transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                  box-shadow 0.4s ease;
    }
    .project-card.revealed {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .project-card.revealed:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.18), 0 0 0 1px rgba(250, 49, 162, 0.08);
    }

    /* Accent divider between sections */
    .section-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(129, 1, 128, 0.2), transparent);
    }

    /* Subtle shimmer on accent buttons */
    .btn-accent {
      position: relative;
      overflow: hidden;
    }
    .btn-accent::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transition: left 0.6s ease;
    }
    .btn-accent:hover::before {
      left: 100%;

    (function() {
      const params = new URLSearchParams(window.location.search);
      const trackingKeys = ['gclid', 'gbraid', 'wbraid', 'utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content'];
      trackingKeys.forEach(key => {
        const val = params.get(key);
        if (val) { try { sessionStorage.setItem('nt_' + key, val); } catch(e) {} }
      });
      // Inject hidden fields into all forms
      function injectTrackingFields() {
        document.querySelectorAll('form').forEach(form => {
          if (form.dataset.trackingInjected) return;
          trackingKeys.forEach(key => {
            const val = sessionStorage.getItem('nt_' + key);
            if (val) {
              const input = document.createElement('input');
              input.type = 'hidden';
              input.name = key;
              input.value = val;
              form.appendChild(input);
            }
          });
          form.dataset.trackingInjected = 'true';
        });

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', injectTrackingFields);

    function isInSection(section, scrollY, offsetBefore = 200, offsetAfter = 100) {
      if (!section) return false;

      const bottom = top + section.offsetHeight;
      return scrollY >= top - offsetBefore && scrollY <= bottom + offsetAfter;

      function animateRing(stepEl, duration, cb) {

        const start = performance.now();
        function tick(now) {

          const eased = 1 - Math.pow(1 - p, 2.5); // ease-out
          ring.style.strokeDashoffset = CIRC * (1 - eased);
          if (p < 1) { requestAnimationFrame(tick); }
          else { stepEl.classList.add('glow'); if (cb) cb(); }

    (function() {
      const slideshowState = new Map();

      // Preload images for smooth transitions

        if (product.images) {
          product.images.forEach(src => { const img = new Image(); img.src = src; });

        if (!product || !product.images || product.images.length === 0) return;

        const imgContainer = card.querySelector('.rounded-lg');
        if (!imgContainer) return;

        // Create overlay images
        const overlayImgs = product.images.map(src => {
          const img = document.createElement('img');
          img.src = src;
          img.alt = product.title + ' Beispiel';
          img.className = 'slideshow-img';
          img.draggable = false;
          imgContainer.appendChild(img);
          return img;
        });

        card.addEventListener('mouseenter', () => {
          if (window.matchMedia('(hover: none)').matches) return;
          let index = 0;
          overlayImgs.forEach(img => img.classList.remove('active'));
          overlayImgs[0].classList.add('active');
          card.classList.add('slideshow-active');

          const interval = setInterval(() => {
            overlayImgs[index].classList.remove('active');
            index = (index + 1) % overlayImgs.length;
            overlayImgs[index].classList.add('active');
          }, 1500);

          slideshowState.set(card, { interval, overlayImgs });
        });

        card.addEventListener('mouseleave', () => {
          const s = slideshowState.get(card);
          if (s) {
            clearInterval(s.interval);
            s.overlayImgs.forEach(img => img.classList.remove('active'));
            card.classList.remove('slideshow-active');
            slideshowState.delete(card);
          }

      window.addEventListener('scroll', function() {

      }, { passive: true });

      var dot = document.createElement('span');
      dot.className = 'w-1.5 h-1.5 rounded-full transition-all duration-300 ' + (i === 0 ? 'bg-dark/60 w-4' : 'bg-dark/20');
      dot.dataset.idx = i;
      dotsContainer.appendChild(dot);
    });

    var currentIdx = 0;
    var autoScrollTimer = null;
    var userTouching = false;

    function scrollToCard(idx) {
      if (idx < 0 || idx >= cards.length) idx = 0;
      currentIdx = idx;
      var cardLeft = cards[idx].offsetLeft;
      var cardWidth = cards[idx].offsetWidth;
      var containerWidth = carousel.offsetWidth;
      carousel.scrollTo({ left: cardLeft - (containerWidth - cardWidth) / 2, behavior: 'smooth' });
      // Update dots
      dotsContainer.querySelectorAll('span').forEach(function(d, i) {
        if (i === idx) {
          d.className = 'w-4 h-1.5 rounded-full transition-all duration-300 bg-dark/60';
        } else {
          d.className = 'w-1.5 h-1.5 rounded-full transition-all duration-300 bg-dark/20';
        }
      });
    }

    function startAutoScroll() {
      stopAutoScroll();
      autoScrollTimer = setInterval(function() {
        if (userTouching) return;
        currentIdx = (currentIdx + 1) % cards.length;
        scrollToCard(currentIdx);
      }, 4000);
    }

    function stopAutoScroll() {
      if (autoScrollTimer) { clearInterval(autoScrollTimer); autoScrollTimer = null; }
    }

    // Pause on touch, resume after
    carousel.addEventListener('touchstart', function() { userTouching = true; stopAutoScroll(); }, { passive: true });
    carousel.addEventListener('touchend', function() {
      userTouching = false;
      // Detect which card is most visible
      setTimeout(function() {
        var carouselRect = carousel.getBoundingClientRect();
        var center = carouselRect.left + carouselRect.width / 2;
        var closest = 0, closestDist = Infinity;
        cards.forEach(function(c, i) {
          var r = c.getBoundingClientRect();
          var dist = Math.abs(r.left + r.width / 2 - center);
          if (dist < closestDist) { closestDist = dist; closest = i; }
        });
        currentIdx = closest;
        scrollToCard(currentIdx);
        startAutoScroll();
      }, 300);
    }, { passive: true });

    // Start
    startAutoScroll();
  }, 500);
})();
</script>

<script>
(function() {
  var exitPopup = document.getElementById('exitPopup');
  var exitKey = 'neontrip_lp_exit_shown';
  var hasScrolled = false;

  window.addEventListener('scroll', function() {
    if (window.scrollY > 600) hasScrolled = true;
  }, { passive: true });

  function showExitPopup() {
    if (hasScrolled && !sessionStorage.getItem(exitKey)) {
      exitPopup.classList.add('show');
      try { sessionStorage.setItem(exitKey, 'true'); } catch(e) {}
    }
  }

  window.closeExitPopup = function() {
    exitPopup.classList.remove('show');
  };

  // Desktop: mouse leaves viewport at top
  document.addEventListener('mouseout', function(e) {
    if (e.clientY < 0 && !e.relatedTarget && !e.toElement) {
      showExitPopup();
    }
  });

  // Mobile: 30s inactivity
  var mobileTimer = null;
  var isMobile = window.matchMedia('(max-width: 768px)').matches || 'ontouchstart' in window;

  function resetMobileTimer() {
    if (mobileTimer) clearTimeout(mobileTimer);
    if (isMobile) {
      mobileTimer = setTimeout(showExitPopup, 30000);
    }
  }

  if (isMobile) {
    ['touchstart', 'scroll', 'click'].forEach(function(evt) {
      document.addEventListener(evt, resetMobileTimer, { passive: true });
    });
    setTimeout(resetMobileTimer, 2000);
  }

  // Back-button trigger (History API popstate)
  if (history.pushState) {
    history.pushState(null, '', location.href);
    window.addEventListener('popstate', function() {
      if (hasScrolled && !sessionStorage.getItem(exitKey)) {
        showExitPopup();
        history.pushState(null, '', location.href);
      }
    });
  }
})();
</script>
