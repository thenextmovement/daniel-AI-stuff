<!-- ===== SECTION: process ===== -->
  <!--        3-STEP PROCESS (So einfach geht's)
       ════════════════════════════════════════ -->
  <section class="bg-white py-10 md:py-14 hidden md:block">
    <div class="max-w-[1000px] mx-auto px-5 md:px-8">

      <!-- Header -->
      <div class="reveal text-center mb-8 md:mb-10">
        <h2 class="text-[36px] md:text-[64px] font-semibold leading-[0.92] tracking-tighter text-dark">3 Schritte.</h2>
      </div>

      <!-- 3 Steps -->
      <div class="process-steps grid grid-cols-3 gap-6 md:gap-5 relative" id="process-steps">

        <!-- Connecting Lines (responsive) -->
        <div class="absolute top-[28px] md:top-12 left-[calc(16.66%+28px)] md:left-[calc(16.66%+48px)] w-[calc(33.33%-32px)] md:w-[calc(33.33%-48px)] h-[1.5px] md:h-0.5 process-line-wrapper">
          <div id="process-line-1" class="process-line w-full h-full bg-gradient-to-r from-dark/50 to-dark/30 rounded-full"></div>
        </div>
        <div class="absolute top-[28px] md:top-12 right-[calc(16.66%+28px)] md:right-[calc(16.66%+48px)] w-[calc(33.33%-32px)] md:w-[calc(33.33%-48px)] h-[1.5px] md:h-0.5 process-line-wrapper">
          <div id="process-line-2" class="process-line w-full h-full bg-gradient-to-r from-dark/30 to-dark/50 rounded-full"></div>
        </div>

        <!-- Step 1: Logo senden -->
        <div class="process-step group text-center" data-step="1">
          <div class="relative inline-flex items-center justify-center w-14 h-14 md:w-24 md:h-24 mb-4">
            <!-- SVG Ring -->
            <svg class="absolute inset-0 w-full h-full -rotate-90" viewBox="0 0 100 100">
              <circle cx="50" cy="50" r="46" fill="none" stroke="rgba(10,10,10,0.08)" stroke-width="2"/>
              <circle class="process-ring-progress" cx="50" cy="50" r="46" fill="none" stroke="rgba(10,10,10,0.7)" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
            <!-- Glow shadow -->
            <div class="ring-glow absolute inset-0 rounded-full" style="box-shadow: 0 0 20px rgba(10,10,10,0.15);"></div>
            <div class="absolute inset-1.5 rounded-full bg-white shadow-sm group-hover:shadow-md transition-shadow duration-300"></div>
            <svg class="process-icon relative w-7 h-7 md:w-8 md:h-8 text-dark/70 group-hover:text-accent transition-colors duration-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <span class="step-number absolute -top-1.5 -right-1.5 w-7 h-7 bg-dark text-white text-xs font-bold rounded-full flex items-center justify-center shadow-lg">1</span>
          </div>
          <h3 class="text-sm md:text-base font-semibold text-dark tracking-tight mb-1">Logo senden</h3>
          <p class="text-xs text-dark/60 leading-relaxed max-w-[200px] mx-auto hidden md:block">PNG, JPG, PDF oder AI – einfach hochladen</p>
        </div>

        <!-- Step 2: Vorschau erhalten -->
        <div class="process-step group text-center" data-step="2">
          <div class="relative inline-flex items-center justify-center w-14 h-14 md:w-24 md:h-24 mb-4">
            <svg class="absolute inset-0 w-full h-full -rotate-90" viewBox="0 0 100 100">
              <circle cx="50" cy="50" r="46" fill="none" stroke="rgba(10,10,10,0.08)" stroke-width="2"/>
              <circle class="process-ring-progress" cx="50" cy="50" r="46" fill="none" stroke="rgba(10,10,10,0.7)" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
            <div class="ring-glow absolute inset-0 rounded-full" style="box-shadow: 0 0 20px rgba(10,10,10,0.15);"></div>
            <div class="absolute inset-1.5 rounded-full bg-white shadow-sm group-hover:shadow-md transition-shadow duration-300"></div>
            <svg class="process-icon relative w-7 h-7 md:w-8 md:h-8 text-dark/70 group-hover:text-accent transition-colors duration-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
            <span class="step-number absolute -top-1.5 -right-1.5 w-7 h-7 bg-dark text-white text-xs font-bold rounded-full flex items-center justify-center shadow-lg">2</span>
          </div>
          <h3 class="text-sm md:text-base font-semibold text-dark tracking-tight mb-1">Vorschau erhalten</h3>
          <p class="text-xs text-dark/60 leading-relaxed max-w-[200px] mx-auto hidden md:block">Kostenlose 3D-Visualisierung — oft in Minuten</p>
        </div>

        <!-- Step 3: Schild geliefert -->
        <div class="process-step group text-center" data-step="3">
          <div class="relative inline-flex items-center justify-center w-14 h-14 md:w-24 md:h-24 mb-4">
            <svg class="absolute inset-0 w-full h-full -rotate-90" viewBox="0 0 100 100">
              <circle cx="50" cy="50" r="46" fill="none" stroke="rgba(10,10,10,0.08)" stroke-width="2"/>
              <circle class="process-ring-progress" cx="50" cy="50" r="46" fill="none" stroke="rgba(10,10,10,0.7)" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
            <div class="ring-glow absolute inset-0 rounded-full" style="box-shadow: 0 0 20px rgba(10,10,10,0.15);"></div>
            <div class="absolute inset-1.5 rounded-full bg-white shadow-sm group-hover:shadow-md transition-shadow duration-300"></div>
            <svg class="process-icon relative w-7 h-7 md:w-8 md:h-8 text-dark/70 group-hover:text-accent transition-colors duration-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16.5 9.4 7.55 4.24"/>
              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
              <polyline points="3.29 7 12 12 20.71 7"/>
              <line x1="12" y1="22" x2="12" y2="12"/>
            </svg>
            <span class="step-number absolute -top-1.5 -right-1.5 w-7 h-7 bg-dark text-white text-xs font-bold rounded-full flex items-center justify-center shadow-lg">3</span>
          </div>
          <h3 class="text-sm md:text-base font-semibold text-dark tracking-tight mb-1">Schild erhalten</h3>
          <p class="text-xs text-dark/60 leading-relaxed max-w-[200px] mx-auto hidden md:block">Fertig montiert geliefert – ab 3 Tagen</p>
        </div>

      </div>

      <!-- CTA -->
      <div class="mt-6 md:mt-8 flex justify-center">
        <button onclick="openFormPopup('{{SLUG}}')" class="btn-accent inline-flex items-center justify-center gap-3 bg-dark hover:bg-dark/90 text-white font-semibold text-sm px-7 py-3.5 rounded-full transition-all duration-300 group">
          Jetzt Projekt starten
          <svg class="w-4 h-4 transition-transform duration-300 group-hover:translate-x-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
          </svg>
        </button>
      </div>

    </div>
  </section>
<!-- ===== /SECTION: process ===== -->
